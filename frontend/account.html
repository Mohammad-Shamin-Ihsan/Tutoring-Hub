<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — TutorHub UAE</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container-page py-10 max-w-lg">
    <h1 class="text-2xl mb-6">My Account</h1>

    <div class="space-y-6">
      <form id="account-form" class="card p-6 space-y-4">
        <h2 class="font-semibold text-brand-900">Account Details</h2>
        <div>
          <label class="form-label">Name</label>
          <input id="settings-name" type="text" class="form-input" />
        </div>
        <div>
          <label class="form-label">Email</label>
          <input id="settings-email" type="email" class="form-input" disabled />
        </div>
        <div>
          <label class="form-label">Phone</label>
          <input id="settings-phone" type="tel" class="form-input" />
        </div>
        <button type="submit" class="btn-primary">Save</button>
      </form>

      <form id="password-form" class="card p-6 space-y-4">
        <h2 class="font-semibold text-brand-900">Change Password</h2>
        <div>
          <label class="form-label">Current Password</label>
          <input required id="current-password" type="password" class="form-input" />
        </div>
        <div>
          <label class="form-label">New Password</label>
          <input required id="new-password" type="password" minlength="8" class="form-input" />
        </div>
        <button type="submit" class="btn-primary">Update Password</button>
      </form>

      <form id="delete-account-form" class="card p-6 space-y-4 border-red-200">
        <h2 class="font-semibold text-red-700">Danger Zone</h2>
        <p class="text-sm text-gray-600">Permanently deletes your account. Your past inquiries stay on record for the tutors you contacted, but you'll no longer be able to log in. This cannot be undone.</p>
        <div>
          <label class="form-label">Confirm Password</label>
          <input required id="delete-password" type="password" class="form-input" />
        </div>
        <button type="submit" class="btn bg-red-600 text-white hover:bg-red-700 focus-visible:ring-red-500">Delete My Account</button>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
