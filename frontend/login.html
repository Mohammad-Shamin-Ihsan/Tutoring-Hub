<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TutorHub UAE</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container-page py-16 max-w-md">
    <div class="card p-8">
      <h1 class="text-2xl mb-1 text-center">Welcome Back</h1>
      <p class="text-gray-600 text-sm text-center mb-6">Log in to your tutor or admin account.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="form-label">Email</label>
          <input required name="email" type="email" class="form-input" />
        </div>
        <div>
          <label class="form-label">Password</label>
          <input required name="password" type="password" class="form-input" />
        </div>
        <button type="submit" class="btn-primary w-full">Login</button>
      </form>

      <p class="text-sm text-gray-600 text-center mt-6">
        Looking for a tutor? <a href="/join.html" class="text-brand-700 font-medium hover:underline">Create an account</a>
      </p>
      <p class="text-sm text-gray-600 text-center mt-2">
        Not a tutor yet? <a href="/register.html" class="text-brand-700 font-medium hover:underline">Become a Tutor</a>
      </p>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
