<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects &amp; Locations — TutorHub UAE Admin</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">
    <div id="admin-sidebar" class="w-64 shrink-0"></div>

    <div class="flex-1 p-6 md:p-8 min-w-0">
      <p class="text-xs text-gray-500">Admin &gt; Subjects &amp; Locations</p>
      <h1 class="text-2xl mb-6">Manage Categories</h1>

      <div class="flex gap-2 mb-6">
        <button data-tab="subjects" class="lookup-tab btn-outline">Subjects</button>
        <button data-tab="locations" class="lookup-tab btn-outline">Locations</button>
        <button data-tab="languages" class="lookup-tab btn-outline">Languages</button>
        <button data-tab="levels" class="lookup-tab btn-outline">Teaching Levels</button>
      </div>

      <div class="grid md:grid-cols-[320px_1fr] gap-6">
        <form id="lookup-form" class="card p-5 h-fit space-y-3">
          <h2 id="lookup-form-title" class="font-semibold text-brand-900">Add Subject</h2>
          <div id="lookup-form-fields"></div>
          <button type="submit" class="btn-primary w-full">Add</button>
        </form>

        <div class="card overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-gray-500 border-b border-gray-200 bg-gray-50">
                <th id="lookup-col-header" class="py-3 px-4">Name</th>
                <th class="py-3 px-4 w-24">Action</th>
              </tr>
            </thead>
            <tbody id="lookup-body">
              <tr><td colspan="2" class="py-6 px-4 text-gray-500">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/admin/layout.js"></script>
  <script src="/js/admin/lookups.js"></script>
</body>
</html>
