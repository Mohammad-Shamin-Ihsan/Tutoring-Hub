<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Tutors — TutorHub UAE Admin</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">
    <div id="admin-sidebar" class="w-64 shrink-0"></div>

    <div class="flex-1 p-6 md:p-8 min-w-0">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <p class="text-xs text-gray-500">Admin &gt; Tutors</p>
          <h1 class="text-2xl">Manage Tutors</h1>
        </div>
        <div class="flex gap-2">
          <select id="status-filter" class="form-select">
            <option value="">All statuses</option>
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="suspended">Suspended</option>
          </select>
          <input id="search-input" type="search" placeholder="Search tutors…" class="form-input w-56" />
        </div>
      </div>

      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b border-gray-200 bg-gray-50">
              <th class="py-3 px-4">Tutor Name</th>
              <th class="py-3 px-4">Subjects</th>
              <th class="py-3 px-4">Submitted</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">Rate</th>
              <th class="py-3 px-4">Actions</th>
            </tr>
          </thead>
          <tbody id="tutors-body">
            <tr><td colspan="6" class="py-6 px-4 text-gray-500">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tutor detail modal -->
  <div id="tutor-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black/50">
    <div class="card w-full max-w-2xl p-6 relative max-h-[90vh] overflow-y-auto">
      <button id="tutor-modal-close" class="absolute top-4 right-4 h-8 w-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500 hover:bg-gray-50">&times;</button>
      <div id="tutor-modal-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/admin/layout.js"></script>
  <script src="/js/admin/tutors.js"></script>
</body>
</html>
