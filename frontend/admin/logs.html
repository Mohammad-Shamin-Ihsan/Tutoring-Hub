<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Log — TutorHub UAE Admin</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">
    <div id="admin-sidebar" class="w-64 shrink-0"></div>

    <div class="flex-1 p-6 md:p-8 min-w-0">
      <p class="text-xs text-gray-500">Admin &gt; Activity Log</p>
      <h1 class="text-2xl mb-6">Activity Log</h1>

      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b border-gray-200 bg-gray-50">
              <th class="py-3 px-4">Admin</th>
              <th class="py-3 px-4">Action</th>
              <th class="py-3 px-4">Target</th>
              <th class="py-3 px-4">Date</th>
            </tr>
          </thead>
          <tbody id="logs-body">
            <tr><td colspan="4" class="py-6 px-4 text-gray-500">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/admin/layout.js"></script>
  <script src="/js/admin/logs.js"></script>
</body>
</html>
